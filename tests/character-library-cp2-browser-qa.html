<!doctype html>
<meta charset="utf-8">
<title>CP2 Image-Backed Character Renderer QA</title>
<style>
body{margin:0;padding:20px;background:#15212c;color:#eef4f7;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto}h1{font-size:20px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}button{border:1px solid #91a8b5;background:#243b4a;color:#f5f8f9;border-radius:7px;padding:8px 12px;cursor:pointer}input{min-width:200px}canvas{display:block;max-width:100%;max-height:72vh;margin:auto;background:#edf3f6;border:1px solid #718896}pre{white-space:pre-wrap;max-height:310px;overflow:auto;background:#0e171d;padding:12px;border-radius:8px}.status{color:#b9e989}
</style>
<main>
 <h1>CP2 · Image-Backed Human Rig</h1>
 <p id="status" class="status">Opening Character Library…</p>
 <div class="controls">
  <button id="landscape">16:9 · 1280×720</button><button id="portrait">9:16 · 720×1280</button>
  <label>Seek <input id="time" type="range" min="0" max="12" step="0.02" value="0"></label><span id="timeLabel">0.00 s</span>
  <label><input id="dual" type="checkbox"> Two instances</label><label><input id="debug" type="checkbox"> Skeleton/joints overlay</label><button id="missing">Missing version diagnostic</button><button id="reload">Reload persistence</button>
 </div>
 <canvas id="stage" width="1280" height="720"></canvas>
 <pre id="result">Preparing fixture…</pre>
</main>
<script type="module">
import { CharacterLibraryStorage } from '../src/render/character-library-storage.js';
import { prepareCharacterLibraryInstances, characterVersionReferenceKey } from '../src/render/character-library-renderer.js';
import { renderObjectScene } from '../src/render/object-scene-renderer.js';

const status=document.querySelector('#status'),output=document.querySelector('#result'),canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),fixture=await(await fetch('../examples/Scientific_Human_Image_Backed_Demo.json')).json(),record=await(await fetch('../examples/character-image-backed-demo/character-library-record.json')).json();
const storage=new CharacterLibraryStorage(),checks=[];let layout='landscape',missingMode=false,prepared=new Map(),time=0;
const add=(name,ok,detail='')=>checks.push({name,result:ok?'PASS':'FAIL',...(detail?{detail}:{})});
const sceneFor=()=>fixture.variants[layout].scenes[0];
function jointTransformResiduals(character){const unit=Math.min(canvas.width,canvas.height),joints=character.pose.joints;let max=0;const rows=[];for(const joint of character.version.rig.joints){const resolved=joints[joint.id],parent=joint.parent_id?joints[joint.parent_id]:null;if(!parent)continue;const c=Math.cos(parent.rotation),s=Math.sin(parent.rotation),dx=joint.position.x*unit*parent.scale,dy=joint.position.y*unit*parent.scale,expected={x:parent.x+dx*c-dy*s,y:parent.y+dx*s+dy*c},residual=Math.hypot(resolved.x-expected.x,resolved.y-expected.y);max=Math.max(max,residual);rows.push({joint:joint.id,parent:joint.parent_id,residual_px:+residual.toFixed(6)});}return{max_residual_px:+max.toFixed(6),links:rows};}
function sampleJointCoverage(character,graph){const sampleCanvas=document.createElement('canvas');sampleCanvas.width=canvas.width;sampleCanvas.height=canvas.height;const sampleContext=sampleCanvas.getContext('2d',{alpha:true});renderObjectScene(sampleContext,{version:2,coordinate_space:'normalized',objects:[],character_instances:graph.character_instances},time,12,{preparedCharacterVersions:prepared});const points=[['shoulder_left','left_upper_arm'],['shoulder_right','right_upper_arm'],['elbow_left','left_forearm'],['elbow_right','right_forearm'],['wrist_left','left_hand'],['wrist_right','right_hand'],['torso_pelvis','pelvis'],['hip_left','left_thigh'],['hip_right','right_thigh'],['knee_left','left_shin'],['knee_right','right_shin'],['ankle_left','left_foot'],['ankle_right','right_foot']];return points.map(([label,jointId])=>{const point=character.pose.joints[jointId],x=Math.round(point.x),y=Math.round(point.y),image=sampleContext.getImageData(x-7,y-7,15,15).data;let covered=0;for(let i=3;i<image.length;i+=4)if(image[i]>=16)covered++;return{connection:label,joint:jointId,center_alpha:image[(7*15+7)*4+3],opaque_fraction:+(covered/225).toFixed(3)};});}
function boneArtworkCoverage(character){const diagnostics=[];for(const part of character.appearance.parts){const anchors=part.binding.attachment_points_px;if(!anchors)continue;const image=character.assets.get(part.asset_id),surface=document.createElement('canvas');surface.width=image.width;surface.height=image.height;const surfaceContext=surface.getContext('2d',{willReadFrequently:true});surfaceContext.drawImage(image,0,0);const pixels=surfaceContext.getImageData(0,0,surface.width,surface.height).data,centerY=Math.round(anchors.from.y);let left=surface.width,right=-1;for(let y=Math.max(0,centerY-2);y<=Math.min(surface.height-1,centerY+2);y++)for(let x=0;x<surface.width;x++)if(pixels[(y*surface.width+x)*4+3]>=16){left=Math.min(left,x);right=Math.max(right,x);}const from=character.pose.joints[part.binding.from_joint_id],to=character.pose.joints[part.binding.to_joint_id],distance=Math.hypot(to.x-from.x,to.y-from.y),scale=distance/(anchors.to.x-anchors.from.x);diagnostics.push({part_id:part.id,from_joint:part.binding.from_joint_id,to_joint:part.binding.to_joint_id,alpha_run_px:[left,right],attachment_run_px:[anchors.from.x,anchors.to.x],from_overdraw_px:+((anchors.from.x-left)*scale).toFixed(2),to_overdraw_px:+((right-anchors.to.x)*scale).toFixed(2)});}return diagnostics;}
async function seedOrVerify(){
 let character=await storage.getCharacter(record.character_id);if(!character){try{await storage.createCharacter({character_id:record.character_id,display_name:record.display_name,description:record.description});}catch(error){if(error.code!=='conflict')throw error;}}
 const blobs=[];for(const asset of record.assets){const response=await fetch('../examples/character-image-backed-demo/'+asset.filename);if(!response.ok)throw new Error('PNG asset fetch failed: '+asset.filename);const blob=await response.blob();const saved=await storage.saveCharacterAsset(blob);if(saved.asset_id!==asset.id||saved.sha256!==asset.sha256)throw new Error('PNG content hash differs from fixture manifest: '+asset.filename);blobs.push({asset_id:asset.id,blob});}
 let version=await storage.getCharacterVersion(record.character_id,record.version);if(!version){version=await storage.publishCharacterVersion({character_id:record.character_id,version:record.version,manifest:record.manifest,rig:record.rig,assets:blobs});add('Publish demo character version',version.content_checksum===record.content_checksum,version.content_checksum);}else add('Published version is immutable and matches fixture checksum',version.content_checksum===record.content_checksum,version.content_checksum);
 if(version.content_checksum!==record.content_checksum)throw new Error('Stored version checksum does not match the checked-in project pin.');
 const base=sceneFor().scene_graph.character_instances;const result=await prepareCharacterLibraryInstances(base,{storage,duration:12});add('Exact IndexedDB version and required PNG assets resolve',result.ready,result.diagnostics.map(item=>item.code).join(', '));if(!result.ready)throw new Error(result.diagnostics.map(item=>item.message).join('\n'));prepared=result.versions;
 const decoded=new Set([...prepared.values()].flatMap(item=>[...item.assets.keys()]));add('Decoded and cached content-addressed image parts',decoded.size===new Set(record.assets.map(asset=>asset.id)).size,`${decoded.size} unique asset IDs`);
}
function activeGraph(){const graph=structuredClone(sceneFor().scene_graph);if(document.querySelector('#dual').checked){const second=structuredClone(graph.character_instances[0]);second.instance_id='teacher_demo_second';second.transform={x:.74,y:.64,scale:.58,rotation:0,opacity:.95};second.actions=[];graph.character_instances.push(second);}if(missingMode){graph.character_instances[0].character_version='99.0.0';}return graph;}
async function render(){const width=layout==='portrait'?720:1280,height=layout==='portrait'?1280:720;canvas.width=width;canvas.height=height;const scene=sceneFor(),graph=activeGraph(),currentReferences=graph.character_instances;let drawVersions=prepared;if(missingMode){const missing=await prepareCharacterLibraryInstances(currentReferences,{storage,duration:12});drawVersions=missing.versions;}
 ctx.clearRect(0,0,width,height);ctx.fillStyle=scene.background;ctx.fillRect(0,0,width,height);const resolved=renderObjectScene(ctx,graph,time,12,{preparedCharacterVersions:drawVersions,debugHumanRig:document.querySelector('#debug').checked});ctx.fillStyle='#24394a';ctx.font=`600 ${Math.max(18,Math.min(width,height)*.028)}px system-ui`;ctx.textAlign='center';ctx.fillText('IMAGE-BACKED HUMAN · M1 RIG + M2 MOTION',width*.70,height*.24,Math.min(width,height)*.70);
 const character=resolved.resolvedImageCharacters[0],jointResiduals=character?.status==='ready'?jointTransformResiduals(character):null,jointCoverage=character?.status==='ready'?sampleJointCoverage(character,graph):[],boneCoverage=character?.status==='ready'?boneArtworkCoverage(character):[],runtimeChecks=character?.status==='ready'?[{name:'Resolved joint hierarchy residual < 0.01 px',result:jointResiduals.max_residual_px<.01?'PASS':'FAIL',detail:jointResiduals.max_residual_px+' px'},{name:'All sampled connection centers have PNG alpha',result:jointCoverage.every(item=>item.center_alpha>=16)?'PASS':'FAIL',detail:jointCoverage.filter(item=>item.center_alpha<16).map(item=>item.connection).join(', ')||'all 13 sample points covered'},{name:'Bone artwork overlaps both attachment planes',result:boneCoverage.every(item=>item.from_overdraw_px>0&&item.to_overdraw_px>0)?'PASS':'FAIL',detail:boneCoverage.map(item=>`${item.part_id} ${item.from_overdraw_px}/${item.to_overdraw_px}px`).join('; ')}]:missingMode?[{name:'Missing pinned version produces explicit diagnostic',result:character?.diagnostics?.some(item=>item.code==='missing_character_version')?'PASS':'FAIL',detail:character?.diagnostics?.map(item=>item.code).join(', ')||'no diagnostic'}]:[{name:'Pinned image-backed instance is ready',result:'FAIL',detail:character?.diagnostics?.map(item=>item.code).join(', ')||character?.status||'missing render result'}];document.querySelector('#timeLabel').textContent=time.toFixed(2)+' s';const allPass=checks.every(item=>item.result==='PASS')&&runtimeChecks.every(item=>item.result==='PASS');output.textContent=JSON.stringify({status:allPass?'PASS':'FAIL',browser:navigator.userAgent,origin:location.origin,layout:`${width}×${height}`,time_seconds:time,character_id:record.character_id,version:record.version,checksum:record.content_checksum,instances:resolved.resolvedImageCharacters.map(item=>({instance_id:item.instance_id,status:item.status,pose_time:item.pose?.time,eye_open:item.pose?.facial?.left_eye_open,diagnostics:item.diagnostics})),joint_transform_residuals:jointResiduals,artwork_coverage_samples:jointCoverage,bone_artwork_coverage:boneCoverage,skeleton_overlay:document.querySelector('#debug').checked,checks:[...checks,...runtimeChecks]},null,2);document.title=`CP2 QA ${width}x${height} ${allPass?'PASS':'FAIL'} ${missingMode?'missing':'ready'}`;
}
try{await seedOrVerify();status.textContent='PASS · Character Library IndexedDB verified; renderer ready.';await render();}catch(error){status.textContent='FAIL · '+error.message;output.textContent=JSON.stringify({status:'FAIL',error:error.stack||String(error),checks},null,2);document.title='FAIL CP2 Browser QA';}
document.querySelector('#landscape').onclick=()=>{layout='landscape';missingMode=false;render();};document.querySelector('#portrait').onclick=()=>{layout='portrait';missingMode=false;render();};document.querySelector('#time').oninput=event=>{time=Number(event.target.value);render();};document.querySelector('#dual').onchange=()=>render();document.querySelector('#missing').onclick=()=>{missingMode=true;render();};document.querySelector('#reload').onclick=()=>location.reload();
document.querySelector('#debug').onchange=()=>render();
</script>
