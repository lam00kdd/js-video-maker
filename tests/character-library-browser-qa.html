<!doctype html>
<meta charset="utf-8">
<title>Character Library IndexedDB browser QA</title>
<style>body{font:14px ui-monospace,Consolas,monospace;background:#101820;color:#d8e8f2;padding:20px}pre{white-space:pre-wrap}button,a{color:#9fe870}</style>
<h1>Character Library real IndexedDB QA</h1>
<p id="hint">Running browser checks…</p>
<pre id="result">running</pre>
<a id="sameOrigin" hidden target="_blank" rel="noreferrer">Open same-origin project context</a>
<script type="module">
import { CharacterLibraryStorage } from '../src/render/character-library-storage.js';
const output=document.querySelector('#result'),hint=document.querySelector('#hint'),params=new URLSearchParams(location.search);
const run=params.get('run')||crypto.randomUUID(),stage=params.get('stage')||'create',dbName='lam-motion-studio.character-library-browser-qa-'+run.replaceAll('-','');
if(!params.has('run')){history.replaceState(null,'',`?run=${run}&stage=create`);}
const savedRun=stage==='reload'||stage==='done'?JSON.parse(sessionStorage.getItem('character-library-browser-qa:'+run)||'{"checks":[],"metrics":{}}'):{checks:[],metrics:{}};
const checks=[...savedRun.checks],metrics={...savedRun.metrics};
const check=(name,ok,detail='')=>{checks.push({name,result:ok?'PASS':'FAIL',...(detail?{detail}:{} )});if(!ok)throw new Error(name+': '+detail);};
const digest=async blob=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),byte=>byte.toString(16).padStart(2,'0')).join('');
const png=async(size,seed)=>{const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d'),image=ctx.createImageData(size,size);for(let p=0;p<image.data.length;p+=4){const n=(p/4+seed*97)|0;image.data[p]=n*31&255;image.data[p+1]=n*17&255;image.data[p+2]=n*13&255;image.data[p+3]=255;}ctx.putImageData(image,0,0);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Canvas PNG encode failed')),'image/png'));};
const openDb=(name,version=1,install)=>new Promise((resolve,reject)=>{const request=indexedDB.open(name,version);request.onupgradeneeded=()=>install?.(request.result);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
const dbRequest=(db,store,method,...args)=>new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly'),request=tx.objectStore(store)[method](...args);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
const rawDelete=(name,store,key)=>new Promise(async(resolve,reject)=>{try{const db=await openDb(name),tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>{db.close();resolve();};tx.onabort=()=>{db.close();reject(tx.error);};}catch(error){reject(error);}});
function fixture(characterId,assetId,blob){const rig={id:'qa_rig',joints:[{id:'root',parent_id:null,position:{x:0,y:0}},{id:'head',parent_id:'root',position:{x:0,y:-.2}}],parts:[]};const manifest={appearance_id:'qa_appearance',version:'1.0.0',backend:'image',rig_compatibility:{rig_semantics:'m1-human-rig',proportion_profile:'adult',required_joints:['root','head']},parts:[{id:'head',type:'image',asset_id:assetId,source_dimensions_px:{width:blob?64:64,height:64},alpha:true,opacity:1,binding:{joint_id:'head'},pivot:{space:'image_px',x:32,y:32},transform:{offset:{x:0,y:0},rotation:0,scale:1},z_index:40,visible:true,required:true}]};return{rig,manifest};}
async function runCreate(){
 const storage=new CharacterLibraryStorage({dbName});const db=await storage.open();check('IndexedDB open + schema upgrade',db.version===1&&['characters','drafts','versions','assets','assetRefs'].every(name=>db.objectStoreNames.contains(name)),`version=${db.version}; stores=${[...db.objectStoreNames].join(',')}; assetRefs.by_owner.unique=${db.transaction('assetRefs').objectStore('assetRefs').index('by_owner').unique}`);await storage.close();
 const samples=[];for(const [size,seed] of [[64,1],[256,2],[512,3]]){const blob=await png(size,seed),assetId='libsha256_'+await digest(blob),start=performance.now(),bitmap=await createImageBitmap(blob),decodeMs=performance.now()-start;bitmap.close();const saved=await storage.saveCharacterAsset(blob);samples.push({size_px:`${size}x${size}`,bytes:blob.size,decode_ms:+decodeMs.toFixed(2),decoded_rgba_bytes:size*size*4,asset_id:assetId,deduplicated:saved.deduplicated});check(`${size}px PNG save and decode`,saved.asset_id===assetId&&saved.size===blob.size,`${blob.size} bytes; ${decodeMs.toFixed(2)} ms decode`);}
 const mainBlob=await png(64,1),assetId='libsha256_'+await digest(mainBlob),duplicate=await storage.saveCharacterAsset(mainBlob);check('Content-addressed deduplication',duplicate.asset_id===assetId&&duplicate.deduplicated===true,'same PNG returns existing asset row');
 const before=await navigator.storage?.estimate?.();await storage.createCharacter({character_id:'char_browser_qa',display_name:'Browser QA'});const draft={display_name:'Browser QA edited',description:'Draft persisted across a page reload',rig:{id:'qa_rig'},manifest:{appearance_id:'qa_appearance'},asset_refs:[assetId]};await storage.saveCharacterDraft('char_browser_qa',draft);const savedBlob={asset_id:assetId,blob:mainBlob};const{rig,manifest}=fixture('char_browser_qa',assetId,mainBlob);const version=await storage.publishCharacterVersion({character_id:'char_browser_qa',version:'1.0.0',manifest,rig,assets:[savedBlob]});const duplicateVersion=await storage.getCharacterVersion('char_browser_qa','1.0.0');check('Publish immutable version',version.content_checksum===duplicateVersion.content_checksum&&version.validation_status==='validated');
 const resolve=await storage.resolveCharacterVersion({instance_id:'qa_instance',character_id:'char_browser_qa',character_version:'1.0.0',character_version_checksum:version.content_checksum,transform:{x:.5,y:.5,scale:1,rotation:0,opacity:1},motion_style:'natural',actions:[]});check('Exact version/checksum resolve before reload',resolve.status==='resolved'&&resolve.assets.get(assetId)?.size===mainBlob.size);
 let duplicateRejected=false;try{await storage.publishCharacterVersion({character_id:'char_browser_qa',version:'1.0.0',manifest,rig,assets:[savedBlob]});}catch(error){duplicateRejected=error.code==='version_conflict';}check('Immutable duplicate version rejected',duplicateRejected);
 const deletion=await storage.deleteAssetIfUnreferenced(assetId);check('Referenced asset deletion guard',deletion.deleted===false&&deletion.reason==='in_use');
 const estimate=await navigator.storage?.estimate?.();metrics.storage={before_usage:before?.usage??null,after_usage:estimate?.usage??null,quota:estimate?.quota??null,samples};metrics.memory={js_heap_used_bytes:performance.memory?.usedJSHeapSize??null,decoded_rgba_estimates:samples.map(x=>x.decoded_rgba_bytes),note:performance.memory?'Chromium performance.memory sample':'JS heap API unavailable; RGBA values are estimates'};
 const lowQuota=new CharacterLibraryStorage({dbName,storageEstimate:async()=>({quota:1,usage:1})});let quota=false;try{await lowQuota.saveCharacterAsset(await png(32,8));}catch(error){quota=error.code==='quota_exceeded';}check('Quota diagnostic on reported low remaining quota',quota,'injected estimate exercises the adapter diagnostic without exhausting browser storage');
 await storage.close();sessionStorage.setItem('character-library-browser-qa:'+run,JSON.stringify({checks,metrics}));history.replaceState(null,'',`?run=${run}&stage=reload`);location.reload();
}
async function runReload(){
 const storage=new CharacterLibraryStorage({dbName});const draft=await storage.getCharacterDraft('char_browser_qa');check('Draft survives same-tab page reload',draft?.display_name==='Browser QA edited'&&draft.asset_refs.length===1);
 const assetId=draft.asset_refs[0],asset=await storage.getAsset(assetId);check('PNG Blob survives same-tab page reload',asset?.blob instanceof Blob&&asset.blob.size>0);check('SHA-256 integrity after reload',asset.sha256===await digest(asset.blob)&&asset.asset_id==='libsha256_'+asset.sha256);
 const version=await storage.getCharacterVersion('char_browser_qa','1.0.0');const reference={instance_id:'qa_instance',character_id:'char_browser_qa',character_version:'1.0.0',character_version_checksum:version.content_checksum,transform:{x:.5,y:.5,scale:1,rotation:0,opacity:1},motion_style:'natural',actions:[]};const resolved=await storage.resolveCharacterVersion(reference);check('Exact pinned version/checksum resolves after reload',resolved.status==='resolved'&&resolved.version.version==='1.0.0'&&resolved.assets.has(assetId));
 const wrong=await storage.resolveCharacterVersion({...reference,character_version_checksum:'0'.repeat(64)});check('Checksum conflict never falls back to latest',wrong.status==='checksum_mismatch');const missing=await storage.resolveCharacterVersion({...reference,character_version:'9.9.9'});check('Missing version is diagnosed without latest fallback',missing.status==='missing_version');
 let failedPublish=false;try{await storage.publishCharacterVersion({character_id:'char_browser_qa',version:'2.0.0',manifest:{...version.manifest,parts:version.manifest.parts.map(part=>({...part,asset_id:'libsha256_'+'f'.repeat(64)}))},rig:version.rig,assets:[]});}catch(error){failedPublish=['missing_required_asset','invalid_manifest'].includes(error.code);}check('Failed publish validation leaves no partial published version',failedPublish&&await storage.getCharacterVersion('char_browser_qa','2.0.0')===null);
 const brokenDbName=dbName+'-rollback';const broken=await openDb(brokenDbName,1,db=>{db.createObjectStore('characters',{keyPath:'character_id'});db.createObjectStore('drafts',{keyPath:'character_id'});db.createObjectStore('versions',{keyPath:['character_id','version']});db.createObjectStore('assets',{keyPath:'asset_id'});const refs=db.createObjectStore('assetRefs',{keyPath:['owner_id','asset_id']});refs.createIndex('by_owner','owner_id',{unique:true});refs.createIndex('by_asset','asset_id',{unique:false});});broken.close();const rollbackStore=new CharacterLibraryStorage({dbName:brokenDbName});await rollbackStore.createCharacter({character_id:'char_rollback_qa',display_name:'Rollback QA'});const b1=await png(64,44),b2=await png(64,45),id1='libsha256_'+await digest(b1),id2='libsha256_'+await digest(b2);const rig={id:'qa_rig',joints:[{id:'root',parent_id:null,position:{x:0,y:0}},{id:'head',parent_id:'root',position:{x:0,y:-.2}}],parts:[]};const manifest={appearance_id:'qa_rollback',version:'1.0.0',backend:'image',rig_compatibility:{rig_semantics:'m1-human-rig',proportion_profile:'adult',required_joints:['root','head']},parts:[id1,id2].map((id,index)=>({id:'part'+index,type:'image',asset_id:id,source_dimensions_px:{width:64,height:64},alpha:true,opacity:1,binding:{joint_id:'head'},pivot:{space:'image_px',x:32,y:32},transform:{offset:{x:0,y:0},rotation:0,scale:1},z_index:40+index,visible:true,required:true}))};let transactionFailed=false;try{await rollbackStore.publishCharacterVersion({character_id:'char_rollback_qa',version:'1.0.0',manifest,rig,assets:[{asset_id:id1,blob:b1},{asset_id:id2,blob:b2}]});}catch(error){transactionFailed=error.code==='storage_failed';}const rolledBack=(await rollbackStore.getCharacterVersion('char_rollback_qa','1.0.0'))===null&&(await rollbackStore.getAsset(id1))===null&&(await rollbackStore.getAsset(id2))===null;check('Native IndexedDB transaction rollback after staged writes',transactionFailed&&rolledBack,'fault fixture makes assetRefs.by_owner unique, so the second reference fails after asset/version writes were queued; all writes must roll back');
 const missingDbName=dbName+'-missing',missingStorage=new CharacterLibraryStorage({dbName:missingDbName});await missingStorage.createCharacter({character_id:'char_missing_qa',display_name:'Missing QA'});const missBlob=await png(64,77),missId='libsha256_'+await digest(missBlob);const mf=fixture('char_missing_qa',missId,missBlob);const mv=await missingStorage.publishCharacterVersion({character_id:'char_missing_qa',version:'1.0.0',manifest:mf.manifest,rig:mf.rig,assets:[{asset_id:missId,blob:missBlob}]});await rawDelete(missingDbName,'assets',missId);const miss=await missingStorage.resolveCharacterVersion({instance_id:'missing',character_id:'char_missing_qa',character_version:'1.0.0',character_version_checksum:mv.content_checksum,transform:{x:.5,y:.5,scale:1,rotation:0,opacity:1},motion_style:'natural',actions:[]});check('Missing published asset diagnostic',miss.status==='asset_error'&&miss.diagnostics.some(item=>item.code==='missing_asset'));
 const sameOriginUrl=`${location.origin}/?characterLibraryQa=${run}`;document.querySelector('#sameOrigin').href=sameOriginUrl;document.querySelector('#sameOrigin').hidden=false;document.querySelector('#sameOrigin').textContent='Open another same-origin project context';
 const final={status:'PASS',browser:navigator.userAgent,origin:location.origin,run,database:dbName,persistence:{same_tab_reload:'PASS',same_profile_tab_reopen:'pending manual close/reopen',cross_context:'open the link below and verify the same origin can access IndexedDB'},checks,metrics};output.textContent=JSON.stringify(final,null,2);document.title='PASS Character Library browser QA';sessionStorage.setItem('character-library-browser-qa:'+run,JSON.stringify({checks,metrics}));history.replaceState(null,'',`?run=${run}&stage=done`);
}
async function runDone(){const storage=new CharacterLibraryStorage({dbName});const draft=await storage.getCharacterDraft('char_browser_qa');const asset=await storage.getAsset(draft.asset_refs[0]);const version=await storage.getCharacterVersion('char_browser_qa','1.0.0');const reopened=draft&&asset?.blob&&version;check('Same-profile tab reopen keeps draft, PNG Blob and published version',!!reopened);const result={status:'PASS',browser:navigator.userAgent,origin:location.origin,run,database:dbName,after_reopened_tab:{draft:!!draft,asset_blob:!!asset?.blob,sha256:asset?.sha256,exact_version:version?.version,checksum:version?.content_checksum},checks,metrics};output.textContent=JSON.stringify(result,null,2);document.title='PASS Character Library reopened-tab QA';}
try{if(stage==='create')await runCreate();else if(stage==='reload')await runReload();else await runDone();}catch(error){const failed={status:'FAIL',browser:navigator.userAgent,origin:location.origin,run,database:dbName,checks,error:error.stack||String(error)};output.textContent=JSON.stringify(failed,null,2);document.title='FAIL Character Library browser QA';}
</script>
